<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Coded Posters | Graphic Design Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05050A;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            color: #eee;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
        }
        .hero h1 {
            font-size: 4.5rem;
            background: linear-gradient(135deg, #FFB347, #FF6B6B, #FF3366);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(255,51,102,0.3);
        }
        .hero p {
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 0.5rem;
            border-top: 1px solid #333;
            display: inline-block;
            padding-top: 0.8rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .poster-frame {
            background: #0A0A0F;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.7);
            transition: transform 0.3s ease, box-shadow 0.3s;
            border: 1px solid rgba(255,51,102,0.2);
        }
        .poster-frame:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 45px -12px rgba(255,51,102,0.3);
            border-color: #ff3366;
        }

        .poster-canvas {
            width: 100%;
            aspect-ratio: 3 / 4;
            display: block;
        }
        .poster-caption {
            padding: 1rem;
            text-align: center;
            background: #0F0F14;
            border-top: 1px solid #222;
        }
        .poster-caption h3 {
            color: #ff6680;
            margin-bottom: 0.3rem;
        }
        .poster-caption p {
            font-size: 0.8rem;
            color: #aaa;
        }

        .contact-box {
            background: rgba(255,51,102,0.08);
            backdrop-filter: blur(12px);
            margin: 4rem 0 2rem;
            padding: 2rem;
            text-align: center;
            border-radius: 60px;
            border: 1px solid rgba(255,51,102,0.4);
        }
        .contact-box p {
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .email {
            background: rgba(255,51,102,0.2);
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 1.5rem;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,51,102,0.5);
        }
        .btn {
            background: #ff3366;
            padding: 12px 28px;
            border-radius: 40px;
            display: inline-block;
            margin: 0.5rem;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #ff3366;
        }
        .btn:hover {
            background: #ff1a55;
            transform: scale(1.02);
        }
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid #1f1f2a;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #555;
        }
        @media (max-width: 700px) {
            .hero h1 { font-size: 2.5rem; }
            .container { padding: 1rem; }
            .email { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>Coded Posters</h1>
        <p>Algorithmic Graphic Design • Typography • Cinematic Style</p>
    </div>

    <div class="gallery" id="posterGallery"></div>

    <div class="contact-box">
        <p>✨ These samples showcase my ability to create modern poster designs.</p>
        <div class="email">avinlangroodi4@gmail.com</div>
        <br>
        <a href="#" class="btn" id="contactFakeBtn">📩 Request a Poster Design</a>
        <a href="#" class="btn btn-outline" id="moreFakeBtn">📁 View More Samples</a>
    </div>
    <footer>
        © Designed for portfolio showcase | All posters created with Canvas/CSS
    </footer>
</div>

<script>
    (function() {
        const postersData = [
            { title: "Sound Waves", desc: "Concert poster – Neon & Frequency style", bgStyle: "neonWave" },
            { title: "Silent City", desc: "Cinematic minimal – Contrast & Texture", bgStyle: "cinematic" },
            { title: "Rebel Type", desc: "3D Typography – Advertising poster", bgStyle: "typo3d" },
            { title: "Ash & Smoke", desc: "Theater poster – Dramatic & Expressive", bgStyle: "fireDrama" }
        ];

        function drawNeonWave(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, w, h);
            
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                for (let x = 0; x <= w; x += 10) {
                    let y = h/2 + Math.sin(x * 0.02 + Date.now() * 0.002 + i) * 50 + Math.sin(x * 0.05) * 20;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = `hsl(${320 + i * 15}, 100%, 60%)`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(w/2, h/2, 70, 0, Math.PI*2);
            ctx.strokeStyle = '#ff44aa';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.font = `bold ${Math.floor(w/12)}px "Segoe UI"`;
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff44aa';
            ctx.fillText("WAVE", w/3.5, h/1.8);
            ctx.shadowBlur = 0;
        }

        function drawCinematic(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const grad = ctx.createLinearGradient(0, 0, w*0.8, h);
            grad.addColorStop(0, '#111122');
            grad.addColorStop(1, '#2a1a2a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            
            for (let i=0;i<30;i++) {
                ctx.fillStyle = `rgba(255, 200, 150, ${Math.random() * 0.2})`;
                ctx.fillRect(Math.random()*w, Math.random()*h, 5, 5);
            }
            ctx.font = `italic ${Math.floor(w/10)}px "Georgia"`;
            ctx.fillStyle = '#ffccaa';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#aa6644';
            ctx.fillText("SILENT", w/6, h/2.5);
            ctx.font = `${Math.floor(w/18)}px monospace`;
            ctx.fillStyle = "#eedd99";
            ctx.fillText("CITY", w/2.2, h/1.5);
            ctx.shadowBlur = 0;
        }

        function drawTypo3d(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = '#030318';
            ctx.fillRect(0, 0, w, h);
            const text = "TYPO";
            ctx.font = `900 ${Math.floor(w/8)}px "Impact", sans-serif`;
            for(let i=4; i>=1; i--) {
                ctx.fillStyle = `rgba(255, 80, 120, ${0.3 - i*0.05})`;
                ctx.fillText(text, w/6 + i*3, h/2 + i*3);
            }
            ctx.fillStyle = "#ff6680";
            ctx.fillText(text, w/6, h/2);
            ctx.font = `bold ${Math.floor(w/22)}px monospace`;
            ctx.fillStyle = "#ffffff";
            ctx.fillText("REBEL TYPE", w/2.6, h/1.2);
        }

        function drawFireDrama(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const grad = ctx.createRadialGradient(w*0.5, h*0.4, 30, w*0.6, h*0.6, 250);
            grad.addColorStop(0, '#441122');
            grad.addColorStop(1, '#1a0a0a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            
            for(let i=0;i<80;i++) {
                ctx.beginPath();
                ctx.moveTo(w*0.3 + Math.sin(i)*15, h*0.7);
                ctx.lineTo(w*0.5 + Math.cos(i)*10, h*0.5);
                ctx.lineTo(w*0.7 + Math.sin(i)*18, h*0.75);
                ctx.fillStyle = `rgba(255, ${80 + i%100}, 30, 0.3)`;
                ctx.fill();
            }
            ctx.font = `bold ${Math.floor(w/12)}px "Segoe UI"`;
            ctx.fillStyle = "#ffaa77";
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ff3300';
            ctx.fillText("ASH", w/3, h/1.6);
            ctx.shadowBlur = 0;
        }

        function renderAllPosters() {
            const gallery = document.getElementById('posterGallery');
            gallery.innerHTML = '';
            for(let i = 0; i < postersData.length; i++) {
                const data = postersData[i];
                const frame = document.createElement('div');
                frame.className = 'poster-frame';
                
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = 800;
                canvas.className = 'poster-canvas';
                
                switch(data.bgStyle) {
                    case 'neonWave': drawNeonWave(canvas); break;
                    case 'cinematic': drawCinematic(canvas); break;
                    case 'typo3d': drawTypo3d(canvas); break;
                    case 'fireDrama': drawFireDrama(canvas); break;
                    default: drawNeonWave(canvas);
                }
                
                const caption = document.createElement('div');
                caption.className = 'poster-caption';
                caption.innerHTML = `<h3>${data.title}</h3><p>${data.desc}</p>`;
                frame.appendChild(canvas);
                frame.appendChild(caption);
                gallery.appendChild(frame);
            }
        }

        function animateNeonPosters() {
            const canvases = document.querySelectorAll('.poster-canvas');
            if(canvases.length >= 1) {
                const firstCanvas = canvases[0];
                if(firstCanvas && postersData[0]?.bgStyle === 'neonWave') {
                    function animateWave() {
                        drawNeonWave(firstCanvas);
                        requestAnimationFrame(animateWave);
                    }
                    animateWave();
                }
            }
        }
        
        renderAllPosters();
        setTimeout(() => {
            animateNeonPosters();
        }, 100);

        document.getElementById('contactFakeBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'mailto:avinlangroodi4@gmail.com';
        });
        document.getElementById('moreFakeBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            alert("More samples are available. Send me a message to see them.");
        });
    })();
</script>
</body>
</html>
