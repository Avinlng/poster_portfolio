<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نمونه پوستر | آکادمی ۵ ستاره</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', 'Vazir', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            color: #eee;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
        }
        .hero h1 {
            font-size: 4rem;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF6B35);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(255, 165, 0, 0.3);
        }
        .hero p {
            font-size: 1.2rem;
            color: #FFD700;
            margin-top: 0.5rem;
            border-top: 1px solid #FFA500;
            display: inline-block;
            padding-top: 0.8rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .poster-frame {
            background: #0F0F1A;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.7);
            transition: transform 0.3s ease, box-shadow 0.3s;
            border: 1px solid rgba(255, 165, 0, 0.3);
        }
        .poster-frame:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 45px -12px rgba(255, 165, 0, 0.4);
            border-color: #FFD700;
        }

        .poster-canvas {
            width: 100%;
            aspect-ratio: 3 / 4;
            display: block;
        }
        .poster-caption {
            padding: 1rem;
            text-align: center;
            background: #0F0F1A;
            border-top: 1px solid #222;
        }
        .poster-caption h3 {
            color: #FFD700;
            margin-bottom: 0.3rem;
        }
        .poster-caption p {
            font-size: 0.8rem;
            color: #aaa;
        }

        .contact-box {
            background: rgba(255, 165, 0, 0.1);
            backdrop-filter: blur(12px);
            margin: 4rem 0 2rem;
            padding: 2rem;
            text-align: center;
            border-radius: 60px;
            border: 1px solid rgba(255, 165, 0, 0.5);
        }
        .contact-box p {
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .email {
            background: rgba(255, 165, 0, 0.2);
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 1.5rem;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 165, 0, 0.5);
            color: #FFD700;
        }
        .btn {
            background: #FFA500;
            padding: 12px 28px;
            border-radius: 40px;
            display: inline-block;
            margin: 0.5rem;
            text-decoration: none;
            color: #1a1a2e;
            font-weight: bold;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #FFA500;
            color: #FFD700;
        }
        .btn:hover {
            background: #FF8C00;
            transform: scale(1.02);
            color: white;
        }
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid #1f1f2a;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #555;
        }
        @media (max-width: 700px) {
            .hero h1 { font-size: 2rem; }
            .container { padding: 1rem; }
            .email { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>آکادمی ۵ ستاره ✨</h1>
        <p>مهدکودک و پیش‌دبستانی | پوسترهای حرفه‌ای</p>
    </div>

    <div class="gallery" id="posterGallery"></div>

    <div class="contact-box">
        <p>🎨 نمونه پوسترهای اختصاصی برای آکادمی ۵ ستاره</p>
        <div class="email">avinlangroodi4@gmail.com</div>
        <br>
        <a href="#" class="btn" id="contactFakeBtn">📩 سفارش طراحی پوستر</a>
        <a href="#" class="btn btn-outline" id="moreFakeBtn">📁 مشاهده نمونه‌های بیشتر</a>
    </div>
    <footer>
        © طراحی شده برای آکادمی ۵ ستاره | تمام پوسترها با کیفیت چاپ بالا
    </footer>
</div>

<script>
    (function() {
        const postersData = [
            { title: "جشن کف‌پارتی 🎓", desc: "جشن فارغ‌التحصیلی کوچولوهای قشنگ | تشویق و بادکنک و جایزه", bgStyle: "graduation" },
            { title: "ثبت‌نام آغاز شد 📝", desc: "شروع ترم جدید | تخفیف ویژه برای ثبت‌نام زودهنگام | ظرفیت محدود", bgStyle: "registration" },
            { title: "جلسه اولیا و مربیان 👨‍👩‍👧", desc: "همکاری برای رشد بهتر فرزندان | حضور شما نور امیده", bgStyle: "parentsMeeting" }
        ];

        function drawGraduation(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(1, '#2d1a4e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            
            for(let i = 0; i < 50; i++) {
                ctx.beginPath();
                ctx.arc(50 + Math.random() * (w - 100), 30 + Math.random() * 100, 3 + Math.random() * 8, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${0.3 + Math.random() * 0.5})`;
                ctx.fill();
            }
            
            ctx.font = `bold ${Math.floor(w/14)}px "Segoe UI"`;
            ctx.fillStyle = '#FFD700';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#FFA500';
            ctx.fillText("🎓", w/2.2, h/3);
            ctx.font = `bold ${Math.floor(w/16)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#FFD700';
            ctx.fillText("جشن فارغ‌التحصیلی", w/7, h/2.2);
            ctx.font = `${Math.floor(w/22)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#FFA500';
            ctx.fillText("آکادمی ۵ ستاره", w/3.5, h/1.5);
            ctx.font = `${Math.floor(w/28)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#FFCC66';
            ctx.fillText("بهترین شروع برای کوچولوهای موفق", w/8, h/1.2);
            ctx.shadowBlur = 0;
        }

        function drawRegistration(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            
            ctx.fillStyle = '#0a1628';
            ctx.fillRect(0, 0, w, h);
            
            for(let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.rect(20 + i*40, h-100, 25, 80);
                ctx.fillStyle = `rgba(255, 165, 0, ${0.2 + i*0.1})`;
                ctx.fill();
            }
            
            ctx.font = `bold ${Math.floor(w/12)}px "Segoe UI"`;
            ctx.fillStyle = '#FFA500';
            ctx.fillText("📝", w/2.3, h/3.5);
            ctx.font = `bold ${Math.floor(w/14)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#FFD700';
            ctx.fillText("ثبت‌نام آغاز شد", w/7, h/2.2);
            ctx.font = `${Math.floor(w/22)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#FFCC66';
            ctx.fillText("تخفیف ۲۰٪ تا پایان ماه", w/6, h/1.6);
            ctx.font = `${Math.floor(w/28)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#aaa';
            ctx.fillText("شماره تماس: ۰۲۱-۵۵۵۵۵۵۵۵", w/5.5, h/1.2);
        }

        function drawParentsMeeting(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            
            const grad = ctx.createLinearGradient(0, h/2, w, h);
            grad.addColorStop(0, '#1a2a3a');
            grad.addColorStop(1, '#0d1a2a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            
            ctx.beginPath();
            ctx.arc(w/2, h/2.5, 60, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 200, 100, 0.15)';
            ctx.fill();
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = `bold ${Math.floor(w/12)}px "Segoe UI"`;
            ctx.fillStyle = '#FFD700';
            ctx.fillText("👨‍👩‍👧", w/2.3, h/3);
            ctx.font = `bold ${Math.floor(w/16)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#FFA500';
            ctx.fillText("جلسه اولیا و مربیان", w/12, h/2);
            ctx.font = `${Math.floor(w/24)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#FFCC66';
            ctx.fillText("پنجشنبه ۲۵ اسفند - ساعت ۱۶", w/11, h/1.5);
            ctx.font = `${Math.floor(w/30)}px "Vazir", "Segoe UI"`;
            ctx.fillStyle = '#aaa';
            ctx.fillText("همکاری برای آینده بهتر فرزندان", w/9, h/1.2);
        }

        function renderAllPosters() {
            const gallery = document.getElementById('posterGallery');
            gallery.innerHTML = '';
            const posterList = [
                { draw: drawGraduation, title: "جشن کف‌پارتی 🎓", desc: "جشن فارغ‌التحصیلی کوچولوهای قشنگ | تشویق و بادکنک و جایزه" },
                { draw: drawRegistration, title: "ثبت‌نام آغاز شد 📝", desc: "شروع ترم جدید | تخفیف ویژه برای ثبت‌نام زودهنگام | ظرفیت محدود" },
                { draw: drawParentsMeeting, title: "جلسه اولیا و مربیان 👨‍👩‍👧", desc: "همکاری برای رشد بهتر فرزندان | حضور شما نور امیده" }
            ];
            
            for(let i = 0; i < posterList.length; i++) {
                const item = posterList[i];
                const frame = document.createElement('div');
                frame.className = 'poster-frame';
                
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = 800;
                canvas.className = 'poster-canvas';
                item.draw(canvas);
                
                const caption = document.createElement('div');
                caption.className = 'poster-caption';
                caption.innerHTML = `<h3>${item.title}</h3><p>${item.desc}</p>`;
                frame.appendChild(canvas);
                frame.appendChild(caption);
                gallery.appendChild(frame);
            }
        }
        
        renderAllPosters();

        document.getElementById('contactFakeBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'mailto:avinlangroodi4@gmail.com';
        });
        document.getElementById('moreFakeBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            alert("نمونه پوسترهای بیشتری برای آکادمی ۵ ستاره آماده است. برای دریافت لطفاً ایمیل بزنید.");
        });
    })();
</script>
</body>
</html>
